[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leashscan"
version = "0.1.2"
description = "Is your AI agent on a leash? Scan what Claude Code, Cursor, Codex, Copilot and MCP servers can reach: secrets, risky configs, YOLO permissions and hidden prompt injection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
keywords = ["security", "ai-agents", "mcp", "claude-code", "cursor", "codex", "prompt-injection", "secrets", "scanner", "devsecops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/amisellati123/leashscan"
Issues = "https://github.com/amisellati123/leashscan/issues"

[project.scripts]
leashscan = "leashscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
